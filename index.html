<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>12-column Grid — 8 + 4 Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>12-column Grid — 8 + 4</h1>
  <p>Resize the browser to see responsive behavior.</p>
  <div class="container" role="list">
    <div class="box wide" role="listitem">
      <strong>Wide box</strong><br>spans 8 of 12 columns
    </div>

    <div class="box narrow" role="listitem">
      <strong>Narrow box</strong><br>spans 4 of 12 columns
    </div>
  </div>
</body>
</html>
